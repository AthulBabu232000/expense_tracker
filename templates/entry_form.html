{% extends "base.html" %}

{% block title %}New Entry - Expense Tracker{% endblock %}

{% block content %}
  <div class="card">
    <div class="card-body">
      <h2 class="card-title">New Expense Entry</h2>

      <form method="post" enctype="multipart/form-data" class="row g-3">
        <div class="col-12">
          <label class="form-label">Item (required)</label>
          <input class="form-control" type="text" name="name" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Category</label>
          <select class="form-select" name="category" id = "category" required>
            <option value="">Select a category</option>
            {% for c in categories %}
              <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Expense (Rs) (required)</label>
          <input class="form-control" type="number" step="0.01" name="amount" required>
        </div>
         <div class="col-md-6">
          <label class="form-label">Opening Balance (Rs) (required)</label>
          <input class="form-control" type="number"  name="OpeningBalance"  readonly>
        </div>
         <div class="col-md-6">
          <label class="form-label">Closing Balance (Rs) (required)</label>
          <input class="form-control" type="number"  name="ClosingBalance"  readonly>
        </div>
        <div class="col-12">
          <label class="form-label">Image (optional)</label>
          <input class="form-control" type="file" name="image" accept="image/*">
        </div>
        <div class="col-12">
          <button class="btn btn-outline-warning" type="submit">Submit</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    (function() {
    const category_limits = {{ closing_balance_of_categories | tojson }};
    console.log(category_limits);
    const categorySelect = document.querySelector("select[name='category']");
    const expenseInput = document.querySelector("input[name='amount']");
    const openingBalanceInput = document.querySelector("input[name='OpeningBalance']");
    const closingBalanceInput = document.querySelector("input[name='ClosingBalance']");
    var category_default=categorySelect.value;
    openingBalanceInput.value=category_default;
    categorySelect.addEventListener("change", function() {
      const selectedCategory = categorySelect.value;
      const openingBalance = category_limits[selectedCategory] || category_default;
      openingBalanceInput.value = openingBalance;
      closingBalanceInput.value=openingBalanceInput.value;
    });

    expenseInput.addEventListener("input", function() {
      const expense = parseFloat(expenseInput.value) || 0;
      const openingBalance = parseFloat(openingBalanceInput.value) || 0;
      const closingBalance = openingBalance - expense;
      closingBalanceInput.value = closingBalance;
    });
    })();
  </script>
{% endblock %}

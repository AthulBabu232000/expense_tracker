{% extends "base.html" %}

{% block title %}New Entry - Expense Tracker{% endblock %}

{% block content %}
  <div class="card">
    <div class="card-body">
      <h2 class="card-title">New Expense Entry</h2>

      <form method="post" enctype="multipart/form-data" class="row g-3">
        <div class="col-12">
          <label class="form-label">Name of item (required)</label>
          <input class="form-control" type="text" name="name" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Category</label>
          <select class="form-select" name="category">
            {% for c in categories %}
              <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Amount (Rs) (required)</label>
          <input class="form-control" type="number" step="0.01" name="amount" required>
        </div>
        <div class="col-12">
          <label class="form-label">Image (optional)</label>
          <input class="form-control" type="file" name="image" accept="image/*">
        </div>
        <div class="col-12">
          <button class="btn btn-primary" type="submit">Submit</button>
          <a class="btn btn-link" href="{{ url_for('monthly') }}">Monthly view</a>
          <a class="btn btn-link" href="{{ url_for('yearly') }}">Yearly view</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="{{ url_for('entry') }}">ExpenseTracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="nav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="{{ url_for('entry') }}">New</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('monthly') }}">Monthly</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('yearly') }}">Yearly</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('admin_login') }}">Admin</a></li>
            <li class="nav-item"><a class="nav-link" href="{{ url_for('category_limits') }}">Limits</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="alert alert-info" role="alert">
            {% for m in messages %}
              <div>{{ m }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <!-- Image preview modal -->
    <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content bg-dark text-light">
          <div class="modal-header border-0">
            <h5 class="modal-title">Image preview</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body text-center">
            <img id="imageModalImg" class="img-fluid modal-img" src="" alt="preview">
          </div>
        </div>
      </div>
    </div>

    <script>
      (function(){
        const imgEl = document.getElementById('imageModalImg');
        const imageModal = document.getElementById('imageModal');
        imageModal.addEventListener('show.bs.modal', function (event) {
          const button = event.relatedTarget;
          const src = button.getAttribute('data-image');
          if(src){
            imgEl.src = src;
          }
        });
        imageModal.addEventListener('hidden.bs.modal', function () { imgEl.src = ''; });
      })();
    </script>
  </body>
</html>
